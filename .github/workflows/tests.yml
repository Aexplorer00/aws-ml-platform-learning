name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
      - name: Train smoke test
        run: python -m ml_platform.train --output artifacts/model.joblib
      - name: Predict smoke test
        run: python -m ml_platform.predict --model artifacts/model.joblib --age 4 --distance 8 --hour 9
